<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<!-- viewport-fit=cover: 노치 기기에서 화면 끝까지 그리고, 여백은 CSS 의 env(safe-area-inset-*) 로 준다.
     이게 없으면 env(safe-area-inset-*) 이 항상 0 이라 하단 탭 바가 홈 인디케이터에 깔린다. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#14111c" />
<title>용병단 — Mercenary Company</title>

<!-- ===== PWA =====
     경로는 전부 상대(`./`)다. 이 사이트는 도메인 루트가 아니라
     `https://sryanius.github.io/merc-company/` 하위에 있어서 절대 경로(`/manifest...`)를 쓰면
     전부 404 가 난다. manifest 안의 start_url·scope·icons 도 같은 이유로 상대 경로다. -->
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192" />

<!-- iOS 는 manifest 를 일부만 읽는다. 아래 3개가 없으면 홈 화면에서 브라우저 껍데기로 뜬다.
     (아이콘·standalone·상태바 색은 iOS 전용 메타로 따로 줘야 한다) -->
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<!-- ★ black-translucent 로 바꾸지 마라. 그건 콘텐츠를 상태바 **아래로** 밀어 넣는 설정인데,
     css/style.css 의 --safe-t(env(safe-area-inset-top)) 를 쓰는 곳이 아직 하나도 없어서
     HUD 의 골드·날짜가 아이폰 시계·배터리와 겹친다. 쓰려면 상단 여백부터 먼저 넣어라. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="용병단" />

<link rel="stylesheet" href="./css/style.css" />

<style>
/* PWA 안내 바 (서비스 워커 갱신 알림 · 세이브 백업 안내).
   css/style.css 를 건드리지 않으려고 여기 둔다 — 이 두 요소 말고는 아무것도 스타일링하지 않는다.
   위치는 토스트와 같은 규칙(하단 탭 바 위)이고, 값도 style.css 의 --navh/--safe-* 를 그대로 쓴다. */
.pwa-bar {
  position: fixed;
  left: max(8px, var(--safe-l, 0px));
  right: max(8px, var(--safe-r, 0px));
  bottom: calc(var(--navh, 0px) + var(--safe-b, 0px) + 10px);
  z-index: 95;                 /* 모달 오버레이(90) 위, 토스트(100) 아래 */
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin: 0 auto; max-width: 620px;
  padding: 10px 12px;
  background: linear-gradient(180deg, #262032, #1c1826);
  border: 1px solid #3a3148; border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .55);
  color: #e8e2d8; font-size: 13px; line-height: 1.45;
}
.pwa-bar[hidden] { display: none; }
.pwa-bar p { margin: 0; flex: 1 1 220px; min-width: 0; }
.pwa-bar b { color: #e0b44a; font-weight: 600; }
.pwa-bar button {
  flex: 0 0 auto;
  min-height: 36px; padding: 7px 14px;
  background: #322a42; color: #e8e2d8;
  border: 1px solid #3a3148; border-radius: 6px;
  font-size: 13px; cursor: pointer; touch-action: manipulation;
}
.pwa-bar button.go { background: #e0b44a; border-color: #e0b44a; color: #1c1826; font-weight: 600; }
.pwa-bar button:active { filter: brightness(1.15); }
@media (max-width: 767px) {
  /* 폰 글자 하한 12px · 터치 타겟 40px (HANDOFF §13.1 판정 3·4) */
  .pwa-bar { font-size: 13px; }
  .pwa-bar button { min-height: 40px; flex: 1 1 auto; }
}
</style>
</head>
<body>
  <div id="app">
    <header id="hud"></header>
    <nav id="nav"></nav>
    <main id="screen"></main>
    <div id="toast-layer"></div>
    <div id="modal-layer"></div>
  </div>

  <!-- 새 배포가 설치됐을 때만 뜬다. skipWaiting 으로 워커는 이미 교체됐지만,
       화면에 떠 있는 모듈은 옛 코드라 새로고침을 해야 실제로 바뀐다. -->
  <div class="pwa-bar" id="pwa-update" hidden>
    <p><b>새 버전</b>이 준비됐다. 새로고침하면 적용된다.</p>
    <button type="button" class="go" id="pwa-update-go">새로고침</button>
    <button type="button" id="pwa-update-x">나중에</button>
  </div>

  <!-- 첫 실행 1회 안내. 세이브는 localStorage 에만 있고, iOS 는 홈 화면에 추가하지 않은
       사이트의 저장소를 7일쯤 안 쓰면 지운다(ITP). 그래서 백업 경로를 미리 알려 둔다.
       ui/app.js 는 다른 담당의 파일이라 손대지 않고 여기서 처리한다. -->
  <div class="pwa-bar" id="pwa-save-note" hidden>
    <p><b>세이브는 이 브라우저에만</b> 저장된다. iOS 는 홈 화면에 추가하지 않은 사이트의 저장소를
      오래 안 쓰면 지운다 — 홈 화면에 추가하고, 가끔 상단 <b>더보기 ▼ → 내보내기</b>로 백업해라.</p>
    <button type="button" class="go" id="pwa-save-note-x">알겠다</button>
  </div>

  <script type="module" src="./src/main.js"></script>

  <script>
  /* ===== PWA 배선 (모듈이 아니라 인라인 클래식 스크립트다 — main.js 와 독립적으로 돌아야 한다) ===== */
  (function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };

    /* --- 1. 첫 실행 세이브 안내 (1회, 폰에서만) ---
       PC(1280px) 화면은 지금과 완전히 같아야 한다는 게 이번 작업의 전제라 폰 분기 안에만 둔다.
       기준선 767px 은 css/style.css · 모든 ui/*.js 와 같은 값이다 (HANDOFF §13.5 규약 1). */
    var NOTE_KEY = 'merc_save_notice_v1';
    var isPhone = window.matchMedia && window.matchMedia('(max-width: 767px)').matches;
    try {
      if (isPhone && !localStorage.getItem(NOTE_KEY)) {
        // 용병단 이름 모달이 먼저 뜨도록 조금 늦춘다. 이 바는 모달 아래쪽 띠라 서로 가리지 않는다.
        setTimeout(function () {
          var bar = $('pwa-save-note');
          if (bar) bar.hidden = false;
        }, 1600);
      }
      $('pwa-save-note-x').addEventListener('click', function () {
        $('pwa-save-note').hidden = true;
        try { localStorage.setItem(NOTE_KEY, '1'); } catch (e) { /* 사생활 모드 — 다음에 또 뜬다 */ }
      });
    } catch (e) { /* localStorage 가 막혀 있으면 안내를 건너뛴다 */ }

    /* --- 2. 서비스 워커 --- */
    // ★ https 에서만 등록한다. tools/serve.mjs(no-store)로 개발할 때 워커가 끼면
    //    "고쳤는데 왜 그대로지?" 함정이 그대로 되살아난다. localhost 는 SW 가 허용되는
    //    보안 컨텍스트지만, 여기서는 **일부러** 등록하지 않는다.
    if (!('serviceWorker' in navigator) || location.protocol !== 'https:') return;

    var updateBar = $('pwa-update');
    var shown = false;
    function showUpdate() {
      if (shown || !updateBar) return;
      shown = true;
      updateBar.hidden = false;
    }
    $('pwa-update-go').addEventListener('click', function () { location.reload(); });
    $('pwa-update-x').addEventListener('click', function () { updateBar.hidden = true; });

    // 워커가 activate 하면서 옛 캐시를 지웠을 때만 알려 온다(첫 설치에는 안 온다).
    navigator.serviceWorker.addEventListener('message', function (e) {
      if (e.data && e.data.type === 'merc-sw-updated') showUpdate();
    });

    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').then(function (reg) {
        // 이미 이 페이지를 제어하는 워커가 있는 상태에서 새 워커가 설치되면 = 갱신이다.
        reg.addEventListener('updatefound', function () {
          var sw = reg.installing;
          if (!sw || !navigator.serviceWorker.controller) return;
          sw.addEventListener('statechange', function () {
            if (sw.state === 'installed' || sw.state === 'activated') showUpdate();
          });
        });
        // 탭을 오래 열어 두는 사람을 위해 한 시간에 한 번 갱신을 확인한다.
        setInterval(function () { reg.update().catch(function () {}); }, 60 * 60 * 1000);
      }).catch(function (err) { console.warn('[pwa] 서비스 워커 등록 실패', err); });
    });
  })();
  </script>
</body>
</html>
